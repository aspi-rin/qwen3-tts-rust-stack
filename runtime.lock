note=The v0.1.6 Linux release only publishes a Vulkan runtime bundle. CPU mode reuses the same runtime bundle without /dev/dri passthrough and relies on llama.cpp/ggml CPU fallback. The asset nests llama.cpp libs under runtime/llama-b7885; docker/Dockerfile flattens lib*.so* into runtime/ for the upstream loader.
