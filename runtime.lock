# Pinned runtime assets used by docker/Dockerfile.
# Application binaries are built from Qwen3-TTS-Rust source at upstream.lock.
# Qwen bundle is used to vendor llama.cpp/ggml shared libraries.
repo=https://github.com/cgisky1980/Qwen3-TTS-Rust
release_tag=v0.1.6
linux_vulkan_asset=qwen3-tts-linux-x64-vulkan.tar.gz
linux_cpu_asset=qwen3-tts-linux-x64-vulkan.tar.gz # upstream has no separate Linux CPU asset; CPU mode runs same server image without GPU passthrough
linux_vulkan_url=https://github.com/cgisky1980/Qwen3-TTS-Rust/releases/download/v0.1.6/qwen3-tts-linux-x64-vulkan.tar.gz
