name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate stack files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Makefile dry-runs
        run: |
          make -n check BACKEND=cpu
          make -n up BACKEND=cpu
          make -n down BACKEND=cpu

      - name: Validate Compose config
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config
          docker compose -f docker-compose.yml -f docker-compose.vulkan.yml config

      - name: Validate Dockerfile syntax
        run: |
          docker build --check -f docker/Dockerfile .

  cpu-smoke:
    name: CPU server image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CPU server image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg QWEN3_TTS_RUNTIME_BACKEND=cpu \
            -t qwen3-tts-rust-stack:v0.1.6-cpu .

      - name: Check server help
        run: |
          docker run --rm qwen3-tts-rust-stack:v0.1.6-cpu --help

      - name: Check server runtime files
        run: |
          docker run --rm --entrypoint bash qwen3-tts-rust-stack:v0.1.6-cpu -lc '
            set -eux
            test -x /app/qwen3_tts_server
            test -f /app/runtime/libonnxruntime.so
            test -f /app/runtime/libllama.so
            test -f /app/runtime/libggml.so
            test -f /app/runtime/libggml-vulkan.so
            test -d /app/speakers
          '

      - name: CPU compose server smoke
        run: |
          mkdir -p models
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml run --rm qwen3-tts --help
