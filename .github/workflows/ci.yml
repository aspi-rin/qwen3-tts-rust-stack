name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate stack files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Makefile dry-runs
        run: |
          make -n check BACKEND=cpu
          make -n build-image BACKEND=cpu
          make -n run BACKEND=cpu
          make -n down BACKEND=cpu
          make -n clean

      - name: Validate Compose config
        run: |
          QWEN3_TTS_IMAGE=qwen3-tts-rust-stack:v0.1.6-cpu \
            docker compose -f docker-compose.yml -f docker-compose.cpu.yml config
          QWEN3_TTS_IMAGE=qwen3-tts-rust-stack:v0.1.6-vulkan \
            docker compose -f docker-compose.yml -f docker-compose.vulkan.yml config

      - name: Validate Dockerfile syntax
        run: |
          docker build --check -f docker/Dockerfile .
          docker build --check -f docker/Dockerfile.source .

  cpu-smoke:
    name: CPU image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CPU image
        run: BACKEND=cpu make build-image

      - name: Check binary help
        run: |
          docker run --rm qwen3-tts-rust-stack:v0.1.6-cpu --help

      - name: Check release runtime libraries
        run: |
          docker run --rm --entrypoint bash qwen3-tts-rust-stack:v0.1.6-cpu -lc '
            set -eux
            test -x /app/qwen3_tts
            test -f /app/runtime/libonnxruntime.so
            test -f /app/runtime/libllama.so
            test -f /app/runtime/libggml.so
            test -f /app/runtime/libggml-vulkan.so
            test -d /app/speakers
          '

      - name: CPU compose command smoke
        run: |
          mkdir -p models outputs
          set +e
          # Exercise the real Compose command. This may reach model download/runtime
          # initialization, but should not fail at CLI argument parsing.
          QWEN3_TTS_INPUT='你好' \
          QWEN3_TTS_IMAGE=qwen3-tts-rust-stack:v0.1.6-cpu \
            timeout 45s docker compose -f docker-compose.yml -f docker-compose.cpu.yml run --rm qwen3-tts >compose.log 2>&1
          status=$?
          set -e
          cat compose.log
          if grep -q "unexpected argument" compose.log; then
            echo "Compose command contains an argument unsupported by the pinned release CLI" >&2
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Compose command completed successfully"
            exit 0
          fi
          if grep -Eiq "Model download failed|Failed to|not found|No such file|download|Permission denied|Read-only file system" compose.log; then
            echo "Compose command reached runtime/model initialization; treating as CLI argument smoke pass"
            exit 0
          fi
          echo "Compose command failed before expected runtime/model initialization" >&2
          exit "$status"
