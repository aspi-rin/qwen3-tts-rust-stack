name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate stack files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Validate Makefile checks
        run: |
          make check BACKEND=cpu
          make -n up BACKEND=cpu
          make -n down BACKEND=cpu

      - name: Validate upstream submodule checkout
        run: |
          test -f upstream/src/models/onnx.rs
          test "$(git -C upstream rev-parse HEAD)" = "32ed8f03c1ca9fbdcb3a888cb4006ca10ccfc74e"

      - name: Validate Compose config
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config
          docker compose -f docker-compose.yml -f docker-compose.vulkan.yml config

      - name: Validate Dockerfile syntax
        run: |
          docker build --check -f docker/Dockerfile .
          docker build --check -f services/openai-api/Dockerfile .

  go-adapter:
    name: Go adapter checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/openai-api/go.mod
          cache-dependency-path: services/openai-api/go.sum

      - name: Check formatting
        run: |
          test -z "$(cd services/openai-api && gofmt -l .)"

      - name: Run tests
        run: |
          cd services/openai-api
          go test ./...

  rust-tools:
    name: Rust wrapper checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/openai-api/go.mod
          cache-dependency-path: services/openai-api/go.sum

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: make fmt-check

      - name: Run wrapper tests
        run: make test

  cpu-smoke:
    name: CPU server image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build CPU server image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg QWEN3_TTS_RUNTIME_BACKEND=cpu \
            -t qwen3-tts-rust-stack:v0.1.6-cpu .

      - name: Build adapter image
        run: |
          docker build -f services/openai-api/Dockerfile -t qwen3-tts-openai-api:latest .

      - name: Check server help
        run: |
          docker run --rm qwen3-tts-rust-stack:v0.1.6-cpu --help

      - name: Check prepare help
        run: |
          docker run --rm --entrypoint /app/qwen3_tts_model_download qwen3-tts-rust-stack:v0.1.6-cpu --help

      - name: Check server runtime files
        run: |
          docker run --rm --entrypoint bash qwen3-tts-rust-stack:v0.1.6-cpu -lc '
            set -eux
            test -x /app/qwen3_tts_server
            test -x /app/qwen3_tts_model_download
            test -f /app/runtime/libonnxruntime.so
            test -f /app/runtime/libllama.so
            test -f /app/runtime/libggml.so
            test -f /app/runtime/libggml-vulkan.so
            test -d /app/speakers
          '

      - name: CPU compose prepare smoke
        run: |
          mkdir -p models
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml run --rm qwen3-tts-model-download --help

      - name: CPU compose server smoke
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml run --rm --no-deps qwen3-tts-server --help

      - name: Adapter container smoke
        run: |
          docker run --rm qwen3-tts-openai-api:latest --help
          docker run --rm --entrypoint test qwen3-tts-openai-api:latest -x /app/qwen3_openai_api
