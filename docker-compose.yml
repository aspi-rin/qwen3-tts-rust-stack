services:
  qwen3-tts:
    image: qwen3-tts-rust-stack:v0.1.6-vulkan
    container_name: qwen3-tts
    volumes:
      - ./models:/app/models:Z
      - ./outputs:/app/outputs:Z
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    command:
      - --model-dir=/app/models
      - --quant=${QWEN3_TTS_QUANT:-q5_k_m}
      - --speakers-dir=/app/speakers
      - --speaker=vivian
      - --text=你好，我是本地语音合成服务。
      - --output=/app/outputs/speech.wav
