services:
  qwen3-tts-model-download:
    image: qwen3-tts-rust-stack:v0.1.6-vulkan
    entrypoint: /app/qwen3_tts_model_download
    command:
      - --model-dir=/app/models
      - --quant=${QWEN3_TTS_QUANT:-q5_k_m}
    volumes:
      - ./models:/app/models:Z
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777

  qwen3-tts-server:
    image: qwen3-tts-rust-stack:v0.1.6-vulkan
    container_name: qwen3-tts-server
    restart: unless-stopped
    depends_on:
      qwen3-tts-model-download:
        condition: service_completed_successfully
    volumes:
      - ./models:/app/models:Z
    environment:
      QWEN3_TTS_DEBUG_LOGS: ${QWEN3_TTS_DEBUG_LOGS:-0}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    command:
      - --host=0.0.0.0
      - --model-dir=/app/models
      - --quant=${QWEN3_TTS_QUANT:-q5_k_m}
      - --speakers-dir=/app/speakers
      - --threads=4
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  qwen3-tts-openai-api:
    image: qwen3-tts-openai-api:latest
    container_name: qwen3-tts-openai-api
    restart: unless-stopped
    depends_on:
      qwen3-tts-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:9746:8080"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
