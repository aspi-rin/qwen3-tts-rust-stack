[package]
name = "qwen3-tts-model-download"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "qwen3_tts_model_download"
path = "src/main.rs"
required-features = ["with-upstream"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
qwen3-tts = { path = "../../upstream", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[features]
default = ["with-upstream"]
with-upstream = ["clap", "qwen3-tts", "tokio"]
vulkan = ["with-upstream", "qwen3-tts/vulkan"]
cuda = ["with-upstream", "qwen3-tts/cuda"]
